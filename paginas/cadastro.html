<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Cadastro — Catia-se Brechó</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="supabase.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{--gold:#C9A84C;--salmon:#E8735A;--salmon-dark:#C45A43;--dark:#1a1a1a;--gray:#888;--font:'Poppins',sans-serif;}
body{font-family:var(--font);background:linear-gradient(135deg,#1a1a1a 0%,#2a1500 100%);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;}
.box{background:#fff;border-radius:20px;width:100%;max-width:460px;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.5);}
.box-header{background:#000;padding:24px 32px;text-align:center;}
.box-header img{height:80px;width:auto;margin:0 auto 8px;object-fit:contain;}
.box-header p{font-size:12px;color:#888;}
.box-body{padding:32px;}
.tabs{display:flex;margin-bottom:24px;border-bottom:2px solid #f0f0f0;}
.tab{flex:1;padding:10px;text-align:center;font-size:13px;font-weight:700;color:var(--gray);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s;}
.tab.active{color:var(--salmon);border-bottom-color:var(--salmon);}
.form-section{display:none;}
.form-section.active{display:block;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:11px;font-weight:700;color:#555;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.field input{width:100%;border:1.5px solid #e0e0e0;border-radius:10px;padding:12px 16px;font-family:var(--font);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s;}
.field input:focus{border-color:var(--salmon);box-shadow:0 0 0 3px rgba(232,115,90,.1);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.btn-main{width:100%;padding:14px;background:var(--salmon);color:#fff;border:none;border-radius:10px;font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;transition:background .2s;margin-top:4px;}
.btn-main:hover{background:var(--salmon-dark);}
.btn-main:disabled{background:#ccc;cursor:not-allowed;}
.divider{text-align:center;color:#ccc;font-size:12px;margin:16px 0;position:relative;}
.divider::before,.divider::after{content:'';position:absolute;top:50%;width:42%;height:1px;background:#eee;}
.divider::before{left:0;}.divider::after{right:0;}
.msg{font-size:12px;text-align:center;margin-top:14px;}
.msg a{color:var(--salmon);font-weight:600;cursor:pointer;}
.success{background:#e8f5e9;border-radius:10px;padding:14px;font-size:14px;color:#388e3c;display:none;margin-bottom:16px;text-align:center;}
.error-box{background:#ffebee;border-radius:10px;padding:12px 16px;font-size:13px;color:#e53935;display:none;margin-bottom:16px;}
.back-link{margin-top:20px;text-align:center;}
.back-link a{font-size:13px;color:rgba(255,255,255,.6);}
.back-link a:hover{color:#fff;}
.loading{display:inline-block;width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin .6s linear infinite;vertical-align:middle;margin-right:6px;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <div class="box-header">
    <img src="logo.png" alt="Catia-se Brechó"/>
    <p>Bem-vinda! Crie sua conta ou acesse para continuar</p>
  </div>
  <div class="box-body">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('cadastro')">Criar Conta</div>
      <div class="tab" onclick="switchTab('login')">Já tenho conta</div>
    </div>

    <!-- CADASTRO -->
    <div class="form-section active" id="form-cadastro">
      <div id="successCad" class="success">✅ Conta criada! Redirecionando...</div>
      <div id="erroCad" class="error-box"></div>
      <div class="field-row">
        <div class="field"><label>Nome *</label><input type="text" id="cadNome" placeholder="Seu nome"/></div>
        <div class="field"><label>Sobrenome</label><input type="text" id="cadSobrenome" placeholder="Sobrenome"/></div>
      </div>
      <div class="field"><label>E-mail *</label><input type="email" id="cadEmail" placeholder="seu@email.com"/></div>
      <div class="field">
        <label>CPF</label>
        <input type="text" id="cadCpf" placeholder="000.000.000-00" maxlength="14" oninput="maskCpf(this)"/>
      </div>
      <div class="field-row">
        <div class="field"><label>Senha *</label><input type="password" id="cadSenha" placeholder="Mínimo 6 caracteres"/></div>
        <div class="field"><label>Confirmar *</label><input type="password" id="cadSenha2" placeholder="Repita a senha"/></div>
      </div>
      <button class="btn-main" id="btnCadastro" onclick="doCadastro()">Criar Minha Conta</button>
      <p class="msg">Já tem conta? <a onclick="switchTab('login')">Entrar aqui</a></p>
    </div>

    <!-- LOGIN -->
    <div class="form-section" id="form-login">
      <div id="successLogin" class="success">✅ Login realizado! Redirecionando...</div>
      <div id="erroLogin" class="error-box"></div>
      <div class="field"><label>E-mail</label><input type="email" id="loginEmail" placeholder="seu@email.com"/></div>
      <div class="field"><label>Senha</label><input type="password" id="loginSenha" placeholder="Sua senha" onkeydown="if(event.key==='Enter')doLogin()"/></div>
      <button class="btn-main" id="btnLogin" onclick="doLogin()">Entrar</button>
      <div class="divider">ou</div>
      <p class="msg">Não tem conta? <a onclick="switchTab('cadastro')">Cadastre-se grátis</a></p>
    </div>
  </div>
</div>
<div class="back-link"><a href="index.html">← Voltar ao site</a></div>

<script>
function switchTab(tab){
  document.querySelectorAll('.tab').forEach((t,i)=>t.classList.toggle('active',(i===0&&tab==='cadastro')||(i===1&&tab==='login')));
  document.getElementById('form-cadastro').classList.toggle('active',tab==='cadastro');
  document.getElementById('form-login').classList.toggle('active',tab==='login');
}

function maskCpf(el){
  let v=el.value.replace(/\D/g,'');
  v=v.replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2');
  el.value=v;
}

function setLoading(btnId, loading){
  const btn=document.getElementById(btnId);
  btn.disabled=loading;
  btn.innerHTML=loading?'<span class="loading"></span>Aguarde...':btn.getAttribute('data-label')||btn.textContent;
}

async function doCadastro(){
  const nome   = document.getElementById('cadNome').value.trim();
  const sobre  = document.getElementById('cadSobrenome').value.trim();
  const email  = document.getElementById('cadEmail').value.trim();
  const senha  = document.getElementById('cadSenha').value;
  const senha2 = document.getElementById('cadSenha2').value;
  const err    = document.getElementById('erroCad');
  err.style.display='none';
  if(!nome||!email||!senha){err.textContent='Preencha nome, e-mail e senha.';err.style.display='block';return;}
  if(senha.length<6){err.textContent='Senha deve ter mínimo 6 caracteres.';err.style.display='block';return;}
  if(senha!==senha2){err.textContent='As senhas não coincidem.';err.style.display='block';return;}
  setLoading('btnCadastro',true);
  try{
    await Auth.signUp(nome+(sobre?' '+sobre:''), email, senha);
    document.getElementById('successCad').style.display='block';
    const redirect=localStorage.getItem('catiase_redirect')||'index.html';
    localStorage.removeItem('catiase_redirect');
    setTimeout(()=>window.location.href=redirect,1500);
  }catch(e){
    err.textContent=e.message.includes('already registered')?'Este e-mail já está cadastrado.':e.message;
    err.style.display='block';
    setLoading('btnCadastro',false);
  }
}

async function doLogin(){
  const email=document.getElementById('loginEmail').value.trim();
  const senha=document.getElementById('loginSenha').value;
  const err=document.getElementById('erroLogin');
  err.style.display='none';
  if(!email||!senha){err.textContent='Preencha e-mail e senha.';err.style.display='block';return;}
  setLoading('btnLogin',true);
  try{
    await Auth.signIn(email,senha);
    document.getElementById('successLogin').style.display='block';
    const profile=getUserProfile();
    const redirect=localStorage.getItem('catiase_redirect')||(profile&&profile.is_admin?'admin.html':'index.html');
    localStorage.removeItem('catiase_redirect');
    setTimeout(()=>window.location.href=redirect,1200);
  }catch(e){
    err.textContent='E-mail ou senha incorretos.';
    err.style.display='block';
    setLoading('btnLogin',false);
  }
}

// Se já logado
if(isLogged()){
  const p=getUserProfile();
  window.location.href=(p&&p.is_admin)?'admin.html':'index.html';
}
</script>
</body>
</html>
